name: Build, Test & Release

# CI: builds and tests the solution on every push/PR to main.
# Release: on a pushed tag "v*" it additionally publishes self-contained,
# single-file builds of the desktop app for Windows, macOS (x64/arm64) and
# Linux, and attaches them as assets to a new GitHub Release.

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION_PATH: src/Abs.DBCC.slnx
  DESKTOP_PROJECT_PATH: src/Abs.DBCC.Desktop
  DESKTOP_ASSEMBLY_NAME: Abs.DBCC.Desktop

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      # Runs the unit test projects and the Testcontainers-based
      # integration test (needs Docker, available by default on ubuntu-latest).
      - name: Run tests
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --verbosity normal

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    strategy:
      matrix:
        rid: [ win-x64, osx-x64, osx-arm64, linux-x64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish (${{ matrix.rid }})
        run: >
          dotnet publish ${{ env.DESKTOP_PROJECT_PATH }}
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -o publish/${{ matrix.rid }}

      - name: Package artifact
        working-directory: publish/${{ matrix.rid }}
        run: zip -r ../../${{ env.DESKTOP_ASSEMBLY_NAME }}-${{ matrix.rid }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DESKTOP_ASSEMBLY_NAME }}-${{ matrix.rid }}
          path: ${{ env.DESKTOP_ASSEMBLY_NAME }}-${{ matrix.rid }}.zip

  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
